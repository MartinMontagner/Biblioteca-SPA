<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <header class="header">
        <h1>Mi biblioteca</h1>
        <p class="header-subtitle">Organizá y filtrá tu colección de libros</p>
    </header>
    <main class="main">
        <div class="aside">
            <section class="form">
                <h2>Agregar Libro</h2>
                <form id="book-form">
                    <div class="form-group">
                        <label for="input-title">Titulo</label>
                        <input type="text" id="input-title" name="title" placeholder="Titulo del libro" required>
                    </div>
                    <div class="form-group">
                        <label for="input-autor">Autor</label>
                        <input type="text" id="input-autor" name="autor" placeholder="Autor del libro" required>
                    </div>
                    <div class="form-group">
                        <label for="input-genero">Genero</label>
                        <input type="text" id="input-genero" name="genero" placeholder="Genero" required>
                    </div>
                    <div class="form-group">
                        <label for="input-year">Año de publicacion</label>
                        <input type="number" id="input-year" name="year" placeholder="Año de publicacion" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Agregar</button>

                </form>
            </section>
            <section class="filter">
                <div></div>
            </section>
            <section>
                <h2>Catalogo</h2>
                <ul></ul>
            </section>
        </div>
    </main>
    <footer></footer>
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>   
</body>
</html>
