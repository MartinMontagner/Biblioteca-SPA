<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="body">
<header class="header">
        <h1>Mi biblioteca</h1>
        <p class="header-subtitle">Organizá y filtrá tu colección de libros</p>
    </header>
    <main class="main">
       <div class="aside">
         <section class="form">
            <h2>Agregar libro</h2>
            <form id="book-form">
                <div class="form-group">
                    <label for="input-title">Título</label>
                    <input type="text" id="input-title" name="title" placeholder="Título" required>
                </div>
                <div class="form-group">
                    <label for="input-author">Autor</label>
                    <input type="text" id="input-author" name="author" placeholder="Autor" required>
                </div>
                <div class="form-group">
                    <label for="input-genre">Género</label>
                    <input type="text" id="input-genre" name="genre" placeholder="Género" required>
                </div>
                <div class="form-group">
                    <label for="input-year">Año de publicación</label>
                    <input type="number" id="input-year" name="year" placeholder="Año de publicación" required>
                </div>
                <button type="submit" class="btn btn-primary">Agregar</button>
            </form>
        </section>

            <section class="filter">
                <h3>Filtrar libros</h3>
                <div class="filter-group">
                    <label for="buscar">Buscar</label>
                    <input type="text" id="buscar" placeholder="Buscar por título o autor">
                </div>
                <div class="filter-group">
                    <label for="filtro-genero">Género</label>
                    <select id="filtro-genero">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <div class="filter-group filter-group-inline">
                    <input type="checkbox" id="mostrar-favoritos">
                    <label for="mostrar-favoritos">Mostrar solo favoritos</label>
                </div>
                <p class="book-count">Cantidad de libros: <span id="book-count">0</span></p>
            </section>
        </div>
        <section class="books">
            <h2>Catálogo</h2>
            <ul id="book-list">
                <!-- Los libros se agregarán aquí dinámicamente -->
            </ul>
            <p class="empty-state" id="empty-state" hidden>No se encontraron libros con esos filtros.</p>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>   
</body>
</html>
